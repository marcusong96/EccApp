# GitHub Actions: run the linter and tests automatically on every push and
# pull request, so broken code is caught before it reaches main.
# Results appear as a check mark (or cross) on commits and pull requests.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -v
